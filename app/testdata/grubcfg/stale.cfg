#
# DO NOT EDIT THIS FILE
#
set default="0"
if [ -s $prefix/grubenv ]; then
  load_env
fi
insmod gfxterm
if loadfont /@/.snapshots/31/snapshot/usr/share/grub/unicode.pf2 ; then
  set gfxmode=auto
fi
### BEGIN /etc/grub.d/10_linux ###
menuentry 'Calaos OS' --class calaos --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-0b1c' {
	load_video
	insmod gzio
	insmod part_gpt
	insmod btrfs
	search --no-floppy --fs-uuid --set=root 0b1c
	echo	'Loading Linux 6.1.0-56-amd64 ...'
	linux	/@/.snapshots/31/snapshot/boot/vmlinuz-6.1.0-56-amd64 root=UUID=0b1c ro   quiet
	echo	'Loading initial ramdisk ...'
	initrd	/@/.snapshots/31/snapshot/boot/initrd.img-6.1.0-56-amd64
}
submenu 'Advanced options for Calaos OS' $menuentry_id_option 'gnulinux-advanced-0b1c' {
	menuentry 'Calaos OS, with Linux 6.1.0-55-amd64' --class calaos $menuentry_id_option 'gnulinux-6.1.0-55-amd64-advanced-0b1c' {
		linux	/@/.snapshots/31/snapshot/boot/vmlinuz-6.1.0-55-amd64 root=UUID=0b1c ro   quiet
		initrd	/@/.snapshots/31/snapshot/boot/initrd.img-6.1.0-55-amd64
	}
}
### END /etc/grub.d/10_linux ###
