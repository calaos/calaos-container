name: Build et release debian package

on:
  # Every push to main publishes a -dev.N prerelease (experimental channel);
  # a manual dispatch publishes a stable major/minor/patch release.
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      vincrement:
        description: 'Package version increment (major.minor.xxx)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  ci:
    name: CI quality gate
    uses: ./.github/workflows/ci.yml

  build-and-push-deb-pkg:
    name: Build deb package and push to repositories
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Calaos Action Bump Version
        id: calaos_version
        uses: calaos/action-bump-version@2
        with:
          version_fragment: ${{ github.event.inputs.vincrement || 'prerelease' }}

      - name: Build package
        uses: addnab/docker-run-action@v3
        id: build
        with:
          image: ghcr.io/calaos/debian_deb_build_base
          # The image's build-deb.sh still seds a version into debian/rules;
          # that is now a no-op, debian/rules reads CALAOS_VERSION instead.
          options: -v ${{ github.workspace }}:/work -e CALAOS_VERSION=${{ steps.calaos_version.outputs.version_bumped }}
          run: /build-deb.sh ${{ steps.calaos_version.outputs.version_bumped }}

      # A lost CALAOS_VERSION falls back to 0.0.0, which sorts below every
      # published deb: boxes would silently never upgrade.
      - name: Check package version
        run: |
          v=$(dpkg-deb -f pkg/calaos-container_*.deb Version)
          case "$v" in "$(echo '${{ steps.calaos_version.outputs.version_bumped }}' | tr - '~')-0~"*) ;; *) echo "bad deb version $v"; exit 1;; esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: pkg/*.deb

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.calaos_version.outputs.version_bumped }}
          token: ${{ secrets.ACTION_DISPATCH }}

      - name: Create a Release
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.ACTION_DISPATCH }}
          tag: ${{ steps.calaos_version.outputs.version_bumped }}
          name: ${{ steps.calaos_version.outputs.version_bumped }}
          # Derived from the version itself so the flag cannot disagree with
          # the tag: only -dev.N versions go to the experimental channel.
          prerelease: ${{ contains(steps.calaos_version.outputs.version_bumped, '-') }}
          files: pkg/*.deb
          gzip: false

      - name: Update repo cache
        uses: distributhor/workflow-webhook@v3
        env:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
